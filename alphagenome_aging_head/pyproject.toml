[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aging-alphagenome"
version = "0.1.0"
description = "Coordinate-only aging-locus classification with frozen AlphaGenome embeddings."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyfaidx>=0.8",
]

[project.scripts]
aging-prepare-data = "aging_alphagenome.data:main"
aging-prepare-negatives = "aging_alphagenome.negative_data:main"
aging-train-cnn = "aging_alphagenome.cnn:main"
aging-audit-composition = "aging_alphagenome.composition_audit:main"
aging-summarize-shortcuts = "aging_alphagenome.shortcut_summary:main"
aging-generate-shuffle-controls = "aging_alphagenome.shuffle_controls:main"
aging-score-cnn = "aging_alphagenome.cnn_score:main"
aging-summarize-shuffle-experiment = "aging_alphagenome.shuffle_experiment_summary:main"
aging-summarize-negative-transfer = "aging_alphagenome.negative_sampling_transfer_summary:main"
aging-extract-features = "aging_alphagenome.features:main"
aging-train-head = "aging_alphagenome.head:train_main"
aging-score-head = "aging_alphagenome.head:score_main"

[tool.setuptools.packages.find]
where = ["src"]
